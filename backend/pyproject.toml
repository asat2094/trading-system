[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # Cache
    "redis[hiredis]>=5.0",
    # Jobs
    "temporalio>=1.6",
    # Data
    "pandas>=2.2",
    "pandas-ta>=0.3.14b",
    "duckdb>=0.10",
    "pyarrow>=16.0",
    "scipy>=1.13",
    # Data sources
    "yfinance>=0.2.38",
    "httpx>=0.27",
    # LLM
    "anthropic>=0.28",
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # Config
    "pydantic-settings>=2.3",
    # Observability
    "structlog>=24.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-jaeger>=1.21",
    # Security gate
    "RestrictedPython>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "data", "technical", "scanner", "llm", "workers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
pythonpath = ["."]
