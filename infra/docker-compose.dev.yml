services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports: ["5432:5432"]
    volumes:
      - ${TRADING_DATA_DIR:-~/.trading-system/data}/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  questdb:
    image: questdb/questdb:8.0.3
    ports:
      - "9000:9000"
      - "8812:8812"
      - "9009:9009"
    volumes:
      - ${TRADING_DATA_DIR:-~/.trading-system/data}/questdb:/root/.questdb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - ${TRADING_DATA_DIR:-~/.trading-system/data}/redis:/data
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    ports: ["7233:7233"]
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=trading
      - POSTGRES_PWD=trading
      - POSTGRES_SEEDS=postgres
    depends_on: [postgres]
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    ports: ["8080:8080"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on: [temporal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ${TRADING_DATA_DIR:-~/.trading-system/data}/prometheus:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    volumes:
      - ${TRADING_DATA_DIR:-~/.trading-system/data}/grafana:/var/lib/grafana
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped

# No named volumes — all data lives at ~/.trading-system/data/ on the host.
# To wipe everything: rm -rf ~/.trading-system/data  (explicit, irreversible)
